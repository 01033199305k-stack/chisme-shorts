# Chismepón (@chismepon, UCyvXZyFPF3XP9jGb-KaWI_g) - 썰가챠 파이프라인의 스페인어 시험판, 2026-10-12
# 목소리: 소희(Qwen3-TTS CustomVoice 한국어 프리셋)가 스페인어로 말함 = "한국 여자가 들려주는 한국 썰".
# 2026-10-12 비교: 억양 변화(음높이 표준편차) 소희 6.2반음 vs Kokoro 도라 3.0 / 알렉스 3.2, 받아쓰기 정확도는 셋 다 0.94.
# edge-tts(es-MX)는 2026-10-12 기준 마이크로소프트 서버가 403 으로 막음 (engine: edge 코드는 남겨 둠).
engine: qwen            # qwen = qwen-tts 직접 실행(GitHub Actions) / voicebox = PC의 Voicebox 앱
voice: Sohee
instruct: "Cuéntalo como un chisme a una amiga, emocionada y con entonación muy expresiva, pronunciando claro hasta el final"
speed: 1.25

# 공개 시각표 (KST). 대본 파일 이름이 scripts/<날짜>-<HHMM>.json, 예: 2026-10-04-0700.json
# 늘리거나 줄이려면 이 목록만 고친다 (대본 담당 예약 작업·감시도 이 목록을 읽는다)
slots: ["07:00", "12:00", "18:00"]   # 2026-10-08~ 하루 3편 (레퍼런스: 군림보 07·12·17시, 도롱차 12:15·15:15·18:15 모두 하루 3편); 10/5~10/7 은 4편(21시 포함)

# 카드: 제목띠(0~535px)는 고정, 패널만 천천히 확대/축소
zoom_target: 1.06
pin_top: 535

# 자막: 2026-10-08 도롱차처럼 최대 두 줄(78px 도현체, 반투명 회색 상자를 그림 아랫부분에 얹음),
# 문장의 cap 값으로 색이 바뀐다 (motion.py CSS #cap). 2026-10-06엔 한 줄 62px였는데 레퍼런스보다 1.5배 작았다
fontsize: 74
caption_words: 6
caption_line_chars: 19
caption_lines: 2

bgm: assets/bgm/backup_plan.mp3      # 2026-10-13 썰가챠(sneaking_around)와 다른 곡 - 재업로드로 안 보이게. OpenGameArt CC0
bgm_gain_db: -10                      # 배경음악 크기 (클수록 큼, -16 이면 말소리에 묻혀 거의 안 들림)
sfx_dir: assets/sfx                   # 비공개 저장소(issue-shorts-assets)에서 받아 온다
transition_sfx: whoosh

brand:
  accent: "#FFE14D"
  ink: "#000000"

# 2026-10-13: 썰가챠와 다른 화면 틀 (motion.THEME_CSS) - 1일차 4편이 쇼츠 피드 노출 0%
theme: chisme
